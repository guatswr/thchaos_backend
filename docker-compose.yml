services:
  backend:
    # 默认与以前完全一致；国内服务器在 .env 里设 DOCKER_REGISTRY / PIP_INDEX_URL
    # 即可把基础镜像和 pip 源切到国内镜像站（见 README 故障排查）。
    build:
      context: .
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    env_file: .env
    volumes:
      - thchaos-data:/var/lib/thchaos
    # 宿主机 9961 → 容器 8765。客户端用裸 IP 直连这个端口
    # （ws://<服务器IP>:9961/ws/game 与 /ws/bot），中间没有 TLS 终结层，
    # 因此务必把端口来源限制在已知 IP 上，见 README「安全清单」。
    ports:
      - "9961:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  thchaos-data:
