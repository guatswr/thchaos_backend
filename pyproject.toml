[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thchaos-backend"
version = "0.1.0"
description = "THChaos 联网投票后端：游戏与 AstrBot 的实时中继"
readme = "README.md"
# 目标是 Python 3.12；用 >= 是为了让本机（3.13）也能直接跑测试。
# 代码只使用 3.12 已有的语法与标准库（StrEnum 需要 3.11+）。
requires-python = ">=3.12"
license = { text = "Proprietary" }

# 运行依赖包含协议模型、WebSocket 服务和 ASGI 启动器；审计使用标准库 SQLite。
dependencies = [
    "pydantic>=2.9,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thchaos_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout：测试直接以源码目录为导入根，无需先安装包。
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
